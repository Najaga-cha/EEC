<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เฝ้าระวังของเสียอุตสาหกรรม EEC · ภาคตะวันออก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6FA;
    --surface:#FFFFFF;
    --surface-2:#EDF2F9;
    --ink:#101827;
    --ink-soft:#57687D;
    --ink-faint:#8697AC;
    --primary:#0B5FA5;
    --primary-2:#2F8FE0;
    --primary-soft:#DDEBFA;
    --alert:#D6483A;
    --alert-soft:#FBE2DE;
    --progress:#D19A22;
    --progress-soft:#FAEDCB;
    --clear:#1E9461;
    --clear-soft:#DFF3E8;
    --line:#DEE6F0;
    --shadow-sm:0 1px 2px rgba(16,27,24,.05);
    --shadow-md:0 10px 30px -14px rgba(16,27,24,.22);
    --shadow-lg:0 24px 60px -20px rgba(16,27,24,.28);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Kanit', sans-serif;
    --font-body:'Noto Sans Thai','Noto Sans',sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0B121D;
    --surface:#111B2C;
    --surface-2:#172234;
    --ink:#E8F0FA;
    --ink-soft:#9FB0C4;
    --ink-faint:#6E7F94;
    --primary:#3B9EEB;
    --primary-2:#63B8F5;
    --primary-soft:#163350;
    --alert:#E8685A;
    --alert-soft:#3A211E;
    --progress:#E3B24C;
    --progress-soft:#3A3020;
    --clear:#3FBE83;
    --clear-soft:#173328;
    --line:#233248;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 10px 30px -14px rgba(0,0,0,.55);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 480px at 85% -10%, color-mix(in srgb, var(--primary) 10%, transparent), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background-color .25s ease, color .25s ease;
  }
  a{color:inherit;}
  ::selection{background:var(--primary);color:#fff;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
  }

  /* ---------- Top nav ---------- */
  nav.topnav{
    position:sticky;top:0;z-index:40;
    backdrop-filter:blur(14px) saturate(1.4);
    -webkit-backdrop-filter:blur(14px) saturate(1.4);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topnav-inner{
    max-width:2200px;margin:0 auto;
    padding:14px clamp(16px,3vw,32px);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:64px;height:64px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;padding:4px;
    box-shadow:0 4px 14px -6px rgba(0,0,0,.25);flex-shrink:0;
  }
  .brand-badge img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-text strong{
    font-family:var(--font-display);font-weight:600;font-size:17px;display:block;letter-spacing:.1px;
  }
  .brand-text small{color:var(--ink-soft);font-size:12.5px;}
  .topnav-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .live-badge{
    display:inline-flex;align-items:center;gap:7px;
    padding:6px 12px;border-radius:99px;
    background:var(--surface-2);border:1px solid var(--line);
    font-size:12.5px;color:var(--ink-soft);
  }
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);position:relative;flex-shrink:0;}
  .pulse.on{background:var(--clear);}
  .pulse.on::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;
    border:2px solid var(--clear);animation:pulse 1.8s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(1.8);opacity:0;}}
  .updated-text{font-size:12px;color:var(--ink-faint);}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;
    border:1px solid var(--line);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--ink);
  }
  .icon-btn:hover{border-color:var(--primary);}
  .icon-btn svg{width:18px;height:18px;}

  /* ---------- Hero ---------- */
  .hero{
    max-width:2200px;margin:0 auto;
    padding:30px clamp(16px,3vw,32px) 6px;
  }
  .hero h1{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(22px,2.6vw,30px);margin:0 0 6px;
  }
  .hero p{margin:0;color:var(--ink-soft);font-size:14px;max-width:640px;}
  .hero-insight{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--alert-soft);color:var(--alert);
    padding:8px 14px;border-radius:99px;font-weight:500;
  }
  .hero-insight:hover{filter:brightness(0.97);}

  /* ---------- Case type tabs ---------- */
  .case-tabs{
    max-width:2200px;margin:18px auto 0;
    padding:0 clamp(16px,3vw,32px);
    display:flex;gap:10px;flex-wrap:wrap;
  }
  .case-tab{
    flex:1 1 220px;min-width:200px;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;border-radius:var(--radius-md,14px);
    border:1.5px solid var(--line);background:var(--surface);
    cursor:pointer;text-align:left;transition:.15s;
  }
  .case-tab:hover{border-color:var(--primary);transform:translateY(-1px);}
  .case-tab .ct-icon{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);color:var(--ink-soft);
  }
  .case-tab .ct-icon svg{width:18px;height:18px;}
  .case-tab .ct-num{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1;}
  .case-tab .ct-lbl{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .case-tab.tab-all.is-active{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 8%, var(--surface));}
  .case-tab.tab-all.is-active .ct-icon{background:var(--primary-soft);color:var(--primary);}
  .case-tab.tab-dumping.is-active{border-color:var(--alert);background:color-mix(in srgb, var(--alert) 8%, var(--surface));}
  .case-tab.tab-dumping.is-active .ct-icon{background:var(--alert-soft);color:var(--alert);}
  .case-tab.tab-factory.is-active{border-color:var(--primary-2);background:color-mix(in srgb, var(--primary-2) 8%, var(--surface));}
  .case-tab.tab-factory.is-active .ct-icon{background:var(--primary-soft);color:var(--primary-2);}

  /* ---------- KPI grid ---------- */
  .kpi-grid{
    max-width:2200px;margin:22px auto 0;
    padding:0 clamp(16px,3vw,32px);
    display:grid;grid-template-columns:repeat(6, 1fr);gap:14px;
  }
  @media (max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{
    padding:18px;display:flex;align-items:center;gap:13px;
    transition:transform .18s ease, box-shadow .18s ease;
    cursor:pointer;
  }
  .kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .kpi-card.is-active{box-shadow:0 0 0 2px var(--primary) inset, var(--shadow-md);}
  .kpi-icon{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .kpi-icon svg{width:20px;height:20px;}
  .kpi-num{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1;}
  .kpi-lbl{font-size:12px;color:var(--ink-soft);margin-top:5px;}

  /* ---------- KPI bento ---------- */
  .kpi-bento{max-width:2200px;margin:22px auto 0;padding:0 clamp(16px,3vw,32px);}
  .kpi-all{
    border-radius:28px;padding:12px;
    background:color-mix(in srgb, var(--ink-soft) 7%, var(--surface));
    border:1px solid color-mix(in srgb, var(--ink-soft) 14%, transparent);
    display:grid;grid-template-columns:1.9fr 1fr 1fr;gap:12px;align-items:stretch;
    position:relative;
  }
  @media (max-width:1100px){.kpi-all{grid-template-columns:1fr;}}
  .kpi-eq{
    grid-column:2 / -1;font-size:12px;color:var(--ink-soft);
    padding:0 6px;margin:0 0 -4px;
  }
  @media (max-width:1100px){.kpi-eq{grid-column:1;}}
  .kpi-group{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;}
  .kpi-group.g-factory{background:color-mix(in srgb, var(--primary-2) 9%, var(--surface));}
  .kpi-group.g-dumping{background:color-mix(in srgb, var(--alert) 8%, var(--surface));}
  .kpi-group .kpi-main{flex:1;}
  .kpi-subs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .kpi-sub{padding:12px 14px;display:flex;align-items:center;gap:11px;}
  .kpi-sub .kpi-icon{width:34px;height:34px;border-radius:10px;}
  .kpi-sub .kpi-icon svg{width:17px;height:17px;}
  .kpi-sub .kpi-num{font-size:20px;}
  .kpi-main{padding:20px;display:flex;align-items:center;gap:15px;}
  .kpi-main .kpi-num{font-size:38px;}
  .kpi-main .kpi-lbl{font-size:14px;}
  .kpi-main .kpi-icon{width:56px;height:56px;border-radius:16px;}
  .kpi-main .kpi-icon svg{width:26px;height:26px;}
  .kpi-total{display:flex;gap:14px;padding:16px;align-items:center;flex-wrap:wrap;grid-row:1 / span 2;}
  @media (max-width:1100px){.kpi-total{grid-row:auto;}}
  .kpi-total .kpi-main{padding:6px;flex:1 1 220px;}
  .kpi-minis{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1 1 260px;}
  .kpi-mini{padding:9px 11px;display:flex;align-items:center;gap:9px;border-radius:14px;border:1px solid var(--line, rgba(0,0,0,.08));background:var(--surface);}
  .kpi-mini .kpi-icon{width:28px;height:28px;border-radius:8px;}
  .kpi-mini .kpi-icon svg{width:14px;height:14px;}
  .kpi-mini .kpi-num{font-size:16px;}
  .kpi-mini .kpi-lbl{font-size:11px;margin-top:2px;}
  .kpi-total{padding:26px 28px;gap:22px;}
  .kpi-total .kpi-main{gap:20px;}
  .kpi-total .kpi-main .kpi-num{font-size:64px;}
  .kpi-total .kpi-main .kpi-lbl{font-size:18px;margin-top:8px;}
  .kpi-total .kpi-main .kpi-icon{width:76px;height:76px;border-radius:22px;}
  .kpi-total .kpi-main .kpi-icon svg{width:36px;height:36px;}
  .kpi-total .kpi-minis{gap:10px;flex:1 1 300px;}
  .kpi-total .kpi-mini{padding:13px 14px;gap:11px;border-radius:16px;}
  .kpi-total .kpi-mini .kpi-icon{width:34px;height:34px;border-radius:10px;}
  .kpi-total .kpi-mini .kpi-icon svg{width:17px;height:17px;}
  .kpi-total .kpi-mini .kpi-num{font-size:20px;}
  .kpi-total .kpi-mini .kpi-lbl{font-size:12px;}


  /* ---------- Filter panel toggle ---------- */
  .filter-toggle-bar{
    max-width:2200px;margin:22px auto 0;
    padding:0 clamp(16px,3vw,32px);
    display:flex;align-items:center;gap:10px;
  }
  .filter-toggle-btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:99px;cursor:pointer;
    border:1.5px solid var(--primary);background:var(--surface);color:var(--primary);
    font-family:var(--font-body);font-size:13.5px;font-weight:600;
    transition:background .15s,color .15s;
  }
  .filter-toggle-btn:hover{background:var(--primary);color:#fff;}
  .filter-toggle-btn svg{width:16px;height:16px;flex-shrink:0;}
  .filter-toggle-btn .ft-count{
    display:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;
    background:var(--alert);color:#fff;font-size:11.5px;line-height:20px;text-align:center;
  }
  .layout.filters-hidden .filter-toggle-btn .ft-count.has{display:inline-block;}
  .layout{transition:grid-template-columns .25s ease;}
  .layout.filters-hidden{grid-template-columns:minmax(0,1fr);}
  .layout.filters-hidden > aside.filters{display:none;}
  .layout + .filter-toggle-bar{display:none;}

  /* ---------- Layout ---------- */
  .layout{
    max-width:2200px;margin:26px auto 0;
    padding:0 clamp(16px,3vw,32px) 60px;
    display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start;
  }
  @media (max-width:940px){.layout{grid-template-columns:1fr;}}

  aside.filters{
    padding:20px;position:static;align-self:start;
    max-height:none;overflow:visible;
  }
  @media (max-width:940px){aside.filters{position:static;max-height:none;}}
  .filters h2{
    font-family:var(--font-display);font-size:14.5px;font-weight:600;
    margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--ink);
  }
  .filters h2 svg{width:16px;height:16px;color:var(--primary);}
  .filter-group{margin-bottom:18px;}
  .filter-group label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .filter-group select, .filter-group input[type="text"], .filter-group input[type="date"]{
    width:100%;padding:9px 11px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-family:var(--font-body);font-size:13.5px;
  }
  .date-range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
  .date-range > div{min-width:0;}
  .filter-group select, .filter-group input[type="text"], .filter-group input[type="date"]{box-sizing:border-box;max-width:100%;min-width:0;}
  .filter-group input[type="date"]{padding:9px 8px;font-size:12.5px;}
  .date-range small{display:block;font-size:11px;color:var(--ink-soft);margin:0 0 3px;}
  .filter-group select:focus, .filter-group input:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:1px solid var(--line);background:var(--surface-2);
    border-radius:99px;padding:6.5px 13px;font-size:12.5px;
    cursor:pointer;color:var(--ink-soft);user-select:none;transition:.15s;
  }
  .chip.active{
    background:linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color:transparent;color:#fff;
    box-shadow:0 4px 12px -4px color-mix(in srgb, var(--primary) 70%, transparent);
  }
  .reset-btn{
    width:100%;padding:10px;border-radius:var(--radius-sm);
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    font-family:var(--font-body);font-size:13px;cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--ink);color:var(--ink);}

  /* ---------- Searchable multi-select ---------- */
  .msel{position:relative;}
  .msel-trigger{
    width:100%;padding:9px 11px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-family:var(--font-body);font-size:13.5px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    cursor:pointer;text-align:left;
  }
  .msel-trigger:hover{border-color:var(--ink-soft);}
  .msel.open .msel-trigger{outline:2px solid var(--primary);outline-offset:1px;}
  .msel-trigger-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .msel-trigger.has-value .msel-trigger-text{color:var(--ink);font-weight:500;}
  .msel-trigger svg{width:15px;height:15px;flex-shrink:0;color:var(--ink-faint);transition:transform .15s;}
  .msel.open .msel-trigger svg{transform:rotate(180deg);}
  .msel-panel{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-md);padding:10px;
  }
  .msel-search{
    width:100%;padding:7px 9px;border-radius:8px;margin-bottom:8px;
    border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);font-family:var(--font-body);font-size:13px;
  }
  .msel-search:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .msel-actions{display:flex;gap:8px;margin-bottom:8px;}
  .msel-mini{
    flex:1;padding:5px 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-soft);font-size:11.5px;cursor:pointer;
    font-family:var(--font-body);
  }
  .msel-mini:hover{border-color:var(--primary);color:var(--primary);}
  .msel-options{max-height:220px;overflow-y:auto;}
  .msel-opt{
    display:flex;align-items:center;gap:9px;padding:6.5px 6px;border-radius:7px;
    cursor:pointer;font-size:13px;color:var(--ink);
  }
  .msel-opt:hover{background:var(--surface-2);}
  .msel-opt input{accent-color:var(--primary);width:15px;height:15px;flex-shrink:0;cursor:pointer;}
  .msel-opt .cnt{margin-left:auto;font-size:11px;color:var(--ink-faint);}
  .msel-empty{padding:14px 6px;text-align:center;font-size:12.5px;color:var(--ink-faint);}

  .source-panel{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .source-panel p.help{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .source-panel input[type="text"]{
    width:100%;padding:9px 11px;border-radius:var(--radius-sm);
    border:1px solid var(--line);background:var(--surface-2);
    font-family:var(--font-body);font-size:12.5px;margin-bottom:8px;
  }
  .btn-primary, .btn-ghost{
    width:100%;padding:10px;border-radius:var(--radius-sm);
    font-family:var(--font-body);font-size:13px;cursor:pointer;margin-bottom:8px;
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--primary), var(--primary-2));
    color:#fff;border:none;
    box-shadow:0 6px 16px -6px color-mix(in srgb, var(--primary) 70%, transparent);
  }
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .upload-drop{
    border:1.5px dashed var(--line);border-radius:var(--radius-sm);
    padding:16px 10px;text-align:center;font-size:12px;color:var(--ink-soft);
    margin-bottom:8px;cursor:pointer;transition:.15s;
  }
  .upload-drop:hover, .upload-drop.drag{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
  .upload-drop input{display:none;}
  .divider-or{
    text-align:center;font-size:11px;color:var(--ink-faint);
    margin:6px 0 10px;position:relative;
  }
  .source-status{
    font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);
    background:var(--clear-soft);color:var(--clear);
    border:1px solid color-mix(in srgb, var(--clear) 30%, transparent);
    display:flex;align-items:flex-start;gap:8px;line-height:1.5;
  }
  .source-status svg{width:15px;height:15px;flex-shrink:0;margin-top:1px;}
  .source-status .msg{flex:1;min-width:0;}
  .source-status.err{
    background:var(--alert-soft);color:var(--alert);
    border-color:color-mix(in srgb, var(--alert) 30%, transparent);
  }
  .source-status.loading{
    background:var(--progress-soft);color:var(--progress);
    border-color:color-mix(in srgb, var(--progress) 30%, transparent);
  }
  .source-status.loading svg{animation:spin 1s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .source-status.neutral{
    background:var(--surface-2);color:var(--ink-soft);
    border-color:var(--line);
  }
  details.howto{margin-top:10px;font-size:12px;color:var(--ink-soft);}
  details.howto summary{cursor:pointer;color:var(--primary);font-weight:500;}
  details.howto ol{padding-left:18px;margin:8px 0 0;}
  details.howto li{margin-bottom:5px;}

  /* ---------- Main ---------- */
  main{display:flex;flex-direction:column;gap:26px;min-width:0;}
  .section-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:12px;flex-wrap:wrap;gap:8px;
  }
  .section-head h2{
